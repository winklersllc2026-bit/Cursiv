# Cursiv website + API on Cloudflare, served at cursiv.winklers-llc.com.
# Publish from this folder with:  node publish.mjs
# (it rebuilds dist/ from an allowlist of public files, then runs `npx wrangler deploy`).
name = "cursiv-web"
main = "worker.js"
compatibility_date = "2026-09-01"
routes = [
  { pattern = "cursiv.winklers-llc.com", custom_domain = true },
]

[assets]
directory = "dist"
binding = "ASSETS"
html_handling = "auto-trailing-slash"   # /board serves board.html, /vision serves vision.html, ...

[vars]
GEMINI_MODEL = "gemini-3.8-flash"
GEMINI_FALLBACK_MODELS = "gemini-3.5-flash"
WORKERS_AI_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"   # used when Gemini is missing or busy
DEMO_DAILY_LIMIT = "500"   # demo replies per day across the whole site
ALLOWED_ORIGINS = "http://localhost:8787,http://127.0.0.1:8787,http://localhost:5500,http://127.0.0.1:5500,http://localhost:1969,http://127.0.0.1:1969,http://cursiv.local:1969"

# Secrets (set once with `npx wrangler secret put NAME`, never written in this file):
#   CURSIV_BOARD_SECRET  signs logins and seals mailbox letters (required)
#   GEMINI_API_KEY       demo chat (optional; without it Workers AI answers)
#   CURSIV_FLEET_TOKEN   owner token for the desktop Fleet Dashboard (optional)

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "cursiv"
database_id = "88c8b4be-7103-49f8-8ac6-feaa86dbc013"

[ai]
binding = "AI"
