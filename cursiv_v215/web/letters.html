<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cursiv — Babel Letters</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⬡</text></svg>">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --gold: #c9a741;
    --gold2: #e8c96b;
    --bg: #080c0c;
    --bg2: #0f1a1a;
    --border: #1e3030;
    --text: #d8d0c0;
    --muted: #607070;
    --silver: #a8b0b8;
  }
  html, body { height: 100%; background: var(--bg); color: var(--text);
    font-family: "Cascadia Code", "Fira Code", "Consolas", monospace; }
  .wrap { max-width: 820px; margin: 0 auto; padding: 40px 20px; }
  .header { display: flex; align-items: center; gap: 14px; margin-bottom: 32px; }
  .glyph { font-size: 42px; color: var(--gold); }
  .title { font-size: 1.05rem; letter-spacing: .22em; color: var(--gold); text-transform: uppercase; }
  .subtitle { font-size: .72rem; color: var(--muted); letter-spacing: .08em; margin-top: 2px; }
  .sealed { margin: 12px 0 28px; font-size: .78rem; color: var(--muted); border-left: 2px solid var(--gold); padding-left: 14px; line-height: 1.45; }
  .letter { background: var(--bg2); border: 1px solid var(--border); padding: 28px 30px; margin-bottom: 22px; }
  .letter-subject { font-size: 1.02rem; color: var(--gold2); margin-bottom: 10px; letter-spacing: .02em; }
  .letter-body { font-size: .96rem; line-height: 1.72; color: var(--text); white-space: pre-wrap; }
  .letter-meta { margin-top: 18px; font-size: .68rem; color: var(--muted); letter-spacing: .06em; }
  .empty, .denied { text-align: center; padding: 60px 20px; color: var(--muted); }
  .denied .glyph { font-size: 64px; display: block; margin-bottom: 16px; }
  .nav { margin-top: 40px; display: flex; gap: 12px; flex-wrap: wrap; }
  .btn { display: inline-block; padding: 10px 18px; border: 1px solid var(--border); color: var(--text);
    text-decoration: none; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; }
  .btn:hover { border-color: var(--gold); color: var(--gold); }
  .top { position: fixed; top: 0; left: 0; right: 0; height: 38px; background: #0a1111;
    border-bottom: 1px solid var(--border); display: flex; align-items: center; padding: 0 18px;
    font-size: .72rem; letter-spacing: .1em; color: var(--muted); z-index: 10; }
  .top .brand { color: var(--gold); margin-right: 12px; }
</style>
</head>
<body>
<div class="top">
  <span class="brand">⬡</span> <span>BABEL LETTERS — SEALED FOR ONE</span>
</div>

<div class="wrap">
  <div class="header">
    <div class="glyph">⬡</div>
    <div>
      <div class="title">Cursiv • Babel Letters</div>
      <div class="subtitle">Private letters, sealed for specific people</div>
    </div>
  </div>

  <div id="content">
    <div class="sealed">
      These words were written for one person only. If this vault has opened for you,
      you already know who they're for. Read slowly.
    </div>
    <div id="letters"></div>
  </div>

  <div class="nav">
    <a class="btn" href="/terminal">Terminal</a>
    <a class="btn" href="/">Home</a>
    <a class="btn" href="/vision">The Vision</a>
  </div>
</div>

<script>
'use strict';
const API_BASE = (location.protocol === 'https:' ? 'https:' : 'http:') + '//' + location.host;

const token = localStorage.getItem('cursiv_token') || '';
const lettersEl = document.getElementById('letters');

async function load() {
  if (!token) {
    lettersEl.innerHTML = `
      <div class="denied">
        <span class="glyph">⬡</span>
        <div>The vault is sealed.</div>
        <div style="margin-top:12px;font-size:.82rem">Sign in at <a href="/terminal" style="color:var(--gold)">the terminal</a> with your credentials.</div>
      </div>`;
    return;
  }

  const isMasterView = new URLSearchParams(location.search).has('master');

  try {
    let url = API_BASE + '/api/legacy/letters';
    if (isMasterView) url += '?master=1';  // will be handled by backend if master

    const res = await fetch(url, {
      headers: { 'Authorization': 'Bearer ' + token }
    });
    if (res.status === 403) {
      lettersEl.innerHTML = `
        <div class="denied">
          <span class="glyph">⬡</span>
          <div>This letter is sealed for someone specific.</div>
          <div style="margin-top:14px">If you believe it was written for you, use the credentials you were given.</div>
        </div>`;
      return;
    }
    if (!res.ok) throw new Error('failed');
    const data = await res.json();
    const letters = data.letters || [];
    if (letters.length === 0) {
      lettersEl.innerHTML = `<div class="empty">The vault is quiet for now.<br>More letters may arrive with time.</div>`;
      return;
    }
    const header = data.for && data.for.includes('master') 
      ? `<div style="margin-bottom:12px;color:#c9a741;font-size:.8rem;">MASTER VIEW — all sealed letters</div>` 
      : '';
    lettersEl.innerHTML = header + letters.map(l => `
      <div class="letter">
        <div class="letter-subject">${escapeHtml(l.subject)}</div>
        <div class="letter-body">${escapeHtml(l.body)}</div>
        <div class="letter-meta">${new Date(l.created).toLocaleDateString()} — for ${escapeHtml(l.for_key || 'you')}</div>
      </div>
    `).join('');
  } catch (e) {
    lettersEl.innerHTML = `<div class="empty">The letters could not be reached right now.<br>Try again from the terminal.</div>`;
  }
}

function escapeHtml(s) {
  return (s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

load();
</script>
</body>
</html>
