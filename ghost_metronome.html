<title>Ghost & The Fracture — Guitar Metronome</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0b0b12;--bg2:#13131e;--bg3:#1a1a2e;
  --border:#2a2a3f;--gold:#FFD700;--lgold:#9B7B20;
  --silver:#C8C8D4;--dim:#666680;--blue:#4a6aff;
  --green:#38b060;--red:#cc4444;--purple:#8844cc;
}
body{background:var(--bg);color:var(--silver);font-family:'Segoe UI',system-ui,sans-serif;
  min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px 16px;}
h1{color:var(--gold);font-size:21px;font-weight:600;letter-spacing:1px;text-align:center;margin-bottom:3px}
.sub{color:var(--dim);font-size:11px;text-align:center;margin-bottom:20px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;
  padding:18px;width:100%;max-width:720px;margin-bottom:14px}
.card-title{color:var(--gold);font-size:13px;font-weight:600;letter-spacing:.5px;margin-bottom:14px}
/* Beat grid */
.beat-grid{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin-bottom:14px}
.bd{width:30px;height:30px;border-radius:6px;background:var(--bg3);border:2px solid var(--border);
  display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--dim);
  transition:all .06s;cursor:default;user-select:none}
.bd.bar1{border-left:3px solid var(--lgold)}
.bd.fib{border-color:var(--purple);color:var(--purple)}
.bd.active{background:var(--gold);border-color:var(--gold);color:#000;
  transform:scale(1.15);box-shadow:0 0 10px rgba(255,215,0,.55)}
.bd.fib.active{background:var(--purple);border-color:var(--purple);color:#fff}
/* Progress */
.progress-wrap{height:3px;background:var(--border);border-radius:2px;margin-bottom:16px;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .12s}
/* BPM row */
.bpm-row{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.bpm-num{font-size:52px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums;
  min-width:88px;line-height:1;text-align:center}
.slider-wrap{flex:1;min-width:160px}
label{color:var(--dim);font-size:10px;letter-spacing:.5px;text-transform:uppercase;
  display:block;margin-bottom:4px}
input[type=range]{-webkit-appearance:none;width:100%;height:4px;
  background:var(--border);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;
  background:var(--gold);border-radius:50%;cursor:pointer}
/* Selects & inputs */
select,input[type=text],input[type=number]{background:var(--bg3);color:var(--silver);
  border:1px solid var(--border);border-radius:6px;padding:6px 10px;font-size:13px;outline:none}
select:focus,input:focus{border-color:var(--blue)}
/* Buttons */
button{background:var(--bg3);color:var(--silver);border:1px solid var(--border);
  border-radius:6px;padding:7px 16px;font-size:13px;cursor:pointer;transition:all .12s}
button:hover{border-color:var(--blue);color:var(--gold)}
.btn-play{background:var(--green);color:#000;font-weight:700;border-color:var(--green)}
.btn-play:hover{background:#45cc70}
.btn-stop{background:var(--red);color:#fff;font-weight:700;border-color:var(--red)}
.btn-tap{border-color:var(--purple);color:var(--purple)}
/* Layers */
.layers-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.lbtn{width:38px;height:38px;border-radius:50%;font-size:11px;font-weight:700;
  display:flex;align-items:center;justify-content:center;padding:0;transition:all .12s}
.lbtn.on{background:var(--gold);color:#000;border-color:var(--gold)}
.lbtn.wail.on{background:var(--purple);color:#fff;border-color:var(--purple)}
.lbtn.off{background:var(--bg3);color:var(--dim)}
/* Song timeline */
.timeline{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:12px;min-height:64px}
.sec-block{flex:none;min-width:90px;border:1px solid var(--border);border-radius:7px;
  padding:8px 10px;cursor:pointer;position:relative;transition:all .12s}
.sec-block:hover{border-color:var(--blue)}
.sec-block.cur{border-color:var(--gold);background:rgba(255,215,0,.06)}
.sec-name{font-size:12px;font-weight:600;margin-bottom:3px}
.sec-meta{font-size:10px;color:var(--dim);line-height:1.5}
.del{position:absolute;top:3px;right:6px;background:none;border:none;
  padding:0;font-size:15px;color:var(--dim);cursor:pointer;line-height:1}
.del:hover{color:var(--red)}
/* Add section form */
.add-form{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;
  padding-top:12px;border-top:1px solid var(--border)}
.field{display:flex;flex-direction:column}
/* Key/Mode row */
.km-row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
/* Beat counter */
.beat-info{display:flex;gap:16px;align-items:center;font-size:11px;color:var(--dim);margin-bottom:6px}
.beat-big{font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums;font-weight:700}
</style>

<h1>Ghost & The Fracture</h1>
<p class="sub">Recursive guitar metronome &nbsp;·&nbsp; All keys &nbsp;·&nbsp; Song structure tracker</p>

<!-- Main controls -->
<div class="card">
  <div class="beat-grid" id="beatGrid"></div>
  <div class="progress-wrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>

    </div>
    <div class="field" style="margin-left:auto">

        <button class="lbtn on" id="lbtn1" onclick="toggleLayer(1)" title="Counter-melody">L2</button>
        <button class="lbtn on" id="lbtn2" onclick="toggleLayer(2)" title="Bass">L3</button>

  <div class="beat-info">

</div>

<!-- Song structure -->
<div class="card">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
    <span class="card-title" style="margin-bottom:0">Song Structure</span>
    <span style="font-size:11px;color:var(--dim)" id="secProgress"></span>
  </div>

  <div class="timeline" id="timeline"></div>

  <div class="add-form">
    <div class="field">
      <label>Name</label>
      <input type="text" id="nName" value="Verse" style="width:110px">
    </div>
    <div class="field">
      <label>BPM</label>
      <input type="number" id="nBpm" value="90" min="20" max="220" style="width:65px">
    </div>
    <div class="field">
      <label>Key</label>
      <select id="nKey">
        <option>C</option><option>C#</option><option>D</option><option>D#</option>
        <option selected>E</option><option>F</option><option>F#</option>
        <option>G</option><option>G#</option><option>A</option><option>A#</option><option>B</option>
      </select>
    </div>
    <div class="field">
      <label>Mode</label>
      <select id="nMode">
        <option selected>Natural Minor</option><option>Major</option>
        <option>Dorian</option><option>Phrygian</option><option>Mixolydian</option>
        <option>Harmonic Minor</option><option>Minor Pent</option>
        <option>Major Pent</option><option>Blues</option>
      </select>
    </div>
    <div class="field">
      <label>Bars</label>
      <input type="number" id="nBars" value="8" min="1" max="256" style="width:60px">
    </div>
    <button onclick="addSection()" style="align-self:flex-end">+ Add Section</button>
  </div>
</div>

<script>
// ── Music theory ──────────────────────────────────────────────────────────────
const KEY_BASE = {
  C:130.81,'C#':138.59,D:146.83,'D#':155.56,E:164.81,
  F:174.61,'F#':185.00,G:196.00,'G#':207.65,A:220.00,'A#':233.08,B:246.94
};
const MODES = {
  'Natural Minor': [0,2,3,5,7,8,10],
  'Major':         [0,2,4,5,7,9,11],
  'Dorian':        [0,2,3,5,7,9,10],
  'Phrygian':      [0,1,3,5,7,8,10],
  'Mixolydian':    [0,2,4,5,7,9,10],
  'Harmonic Minor':[0,2,3,5,7,8,11],
  'Minor Pent':    [0,3,5,7,10],
  'Major Pent':    [0,2,4,7,9],
  'Blues':         [0,3,5,6,7,10],
};

// ── Fibonacci set ─────────────────────────────────────────────────────────────
const FIB = new Set();
{let a=1,b=1;while(a<32){FIB.add(a);[a,b]=[b,a+b];}}

// ── Binary voice seeds ────────────────────────────────────────────────────────
const SEED_VOICES = [
  "10101010101010101111000010101010",
  "01010101110101010111111001010101",
  "00101010101011111111100010001000"
];

// ── State ─────────────────────────────────────────────────────────────────────
let ctx = null, timerID = null, playing = false;
let beat = 0, nextTime = 0;
let curSec = 0, beatsInSec = 0, totalBeats = 0;
let voices = SEED_VOICES.map(s=>s.split(''));
let genN = 0;
let layers = [true,true,true], wailOn = true;
let tapTimes = [];
let scheduledBeats = [];  // [{pos, time}] for UI sync
let noteCache = {};       // freq.toFixed(2) → AudioBuffer

// Song sections
let sections = [{name:'Full Song', bpm:90, key:'E', mode:'Natural Minor', bars:32, sig:4}];

// ── Scale helpers ─────────────────────────────────────────────────────────────
function scaleFreqs(key, mode) {
  const root = KEY_BASE[key];
  const ivals = MODES[mode] || MODES['Natural Minor'];
  // Two octaves of scale
  const notes = [];
  for (let oct=0;oct<2;oct++)
    for (const st of ivals)
      notes.push(root * Math.pow(2, (oct*12+st)/12));
  return notes;
}

// ── Karplus-Strong ────────────────────────────────────────────────────────────
function karplus(freq, dur) {
  const SR = ctx.sampleRate;
  const n  = Math.floor(SR * dur);
  const dl = Math.max(2, Math.round(SR / freq));
  const ring = new Float32Array(dl);
  // Deterministic seeded noise per frequency
  let rng = (Math.floor(freq * 100) % 99991) | 1;
  for (let i=0;i<dl;i++){rng=(rng*1664525+1013904223)>>>0;ring[i]=rng/2147483648-1;}
  const damp = 0.497 - (freq < 200 ? 0.002 : 0);
  const data = new Float32Array(n);
  for (let i=0;i<n;i++){
    data[i]=ring[i%dl];
    ring[i%dl]=damp*(ring[i%dl]+ring[(i+1)%dl]);
  }
  let pk=0; for(const v of data) if(Math.abs(v)>pk) pk=Math.abs(v);
  if(pk>1e-9) for(let i=0;i<n;i++) data[i]/=pk;
  const buf = ctx.createBuffer(1, n, SR);
  buf.copyToChannel(data, 0);
  return buf;
}

function ensureNote(freq) {
  const k = freq.toFixed(2);
  if (!noteCache[k]) {
    const dur = freq<150?0.90:(freq<280?0.72:(freq<500?0.58:0.44));
    noteCache[k] = karplus(freq, dur);
  }
}

function playNote(freq, vol, time) {
  ensureNote(freq);
  const buf = noteCache[freq.toFixed(2)];
  const src = ctx.createBufferSource();
  src.buffer = buf;
  const g = ctx.createGain();
  g.gain.setValueAtTime(Math.min(1, Math.max(0, vol)), time);
  src.connect(g); g.connect(ctx.destination);
  src.start(time);
}

function playWail(freq, vol, time) {
  // Pitch sweep up one octave — the ghost WAAAA
  const o1 = ctx.createOscillator(), o2 = ctx.createOscillator();
  const g  = ctx.createGain();
  o1.type = o2.type = 'sine';
  o1.frequency.setValueAtTime(freq, time);
  o1.frequency.exponentialRampToValueAtTime(freq*2, time+0.36);
  o2.frequency.setValueAtTime(freq*1.008, time);
  o2.frequency.exponentialRampToValueAtTime(freq*2*1.008, time+0.36);
  g.gain.setValueAtTime(0, time);
  g.gain.linearRampToValueAtTime(vol*0.65, time+0.025);
  g.gain.exponentialRampToValueAtTime(0.0001, time+0.42);
  o1.connect(g); o2.connect(g); g.connect(ctx.destination);
  o1.start(time); o2.start(time); o1.stop(time+0.45); o2.stop(time+0.45);
}

// ── Binary evolution ──────────────────────────────────────────────────────────
function evolve(v, gen, chaos) {
  const b=[...v], n=b.length;
  let h=2166136261;
  const s=String(gen);
  for(let i=0;i<s.length;i++){h=(h^s.charCodeAt(i))*16777619>>>0;}
  for(let i=0;i<n;i++){
    if(FIB.has(i)) b[i]=b[i]!==b[(i+1)%n]?'1':'0';
    if(((h>>(i%32))&1)&&(i+gen*3)%13===0) b[i]='1';
    if(chaos>0&&Math.random()<chaos*0.18) b[i]=b[i]==='1'?'0':'1';
  }
  return b;
}

// ── Scheduler ─────────────────────────────────────────────────────────────────
const LOOKAHEAD = 25, AHEAD = 0.12;

function scheduleNote(beatIdx, time) {
  const sec    = sections[curSec] || sections[0];
  const notes  = scaleFreqs(sec.key, sec.mode);
  const root   = KEY_BASE[sec.key];
  const pos    = beatIdx % 32;
  const isFib  = FIB.has(pos);
  const sig    = parseInt(document.getElementById('timeSig').value) || 4;
  const isDown = beatIdx % (sig * 4) === 0; // downbeat of bar

  // Evolve every 8 beats
  if (beatIdx % 8 === 0) {
    genN++;
    const chaos = Math.max(0, (genN-12)*0.025);
    voices = voices.map((v,i) => evolve(v, genN+i*4, chaos));
  }

  const vol = Math.min(1, 0.5 + genN*0.018);

  // Layer 1 — melodic mid register
  if (layers[0] && voices[0][pos]==='1') {
    if (isFib && wailOn) {
      playWail(root * 2, vol * 1.15, time);
    } else {
      const ni = Math.floor(beatIdx/4) % notes.length;
      playNote(notes[ni], vol, time);
    }
    scheduledBeats.push({pos, time});
  }

  // Layer 2 — counter-melody (offset +2 in scale)
  if (layers[1] && voices[1][pos]==='1') {
    const ni = (Math.floor(beatIdx/4)+2) % notes.length;
    playNote(notes[ni], vol*0.78, time);
  }

  // Layer 3 — bass root, downbeats only
  if (layers[2] && voices[2][pos]==='1' && isDown) {
    playNote(root / 2, vol*0.88, time);
  }

  // Track section advancement
  beatsInSec++;
  totalBeats++;
  const beatsPerSec = (sections[curSec]||sections[0]).bars * sig * 4;
  if (beatsInSec >= beatsPerSec) {
    beatsInSec = 0;
    if (sections.length > 1)
      curSec = (curSec + 1) % sections.length;
  }
}

function scheduler() {
  while (nextTime < ctx.currentTime + AHEAD) {
    scheduleNote(beat, nextTime);
    const bpm = (sections[curSec]||sections[0]).bpm;
    nextTime += 60 / bpm / 4;
    beat++;
  }
  timerID = setTimeout(scheduler, LOOKAHEAD);
}

// ── Play / Stop ───────────────────────────────────────────────────────────────
function startPlay() {
  if (!ctx) ctx = new AudioContext();
  if (ctx.state==='suspended') ctx.resume();
  // Pre-generate notes for all sections
  for (const sec of sections) {
    for (const f of scaleFreqs(sec.key, sec.mode)) ensureNote(f);
    ensureNote(KEY_BASE[sec.key]/2);  // bass
    ensureNote(KEY_BASE[sec.key]*2);  // high
  }
  playing=true; beat=0; nextTime=ctx.currentTime+0.05;
  curSec=0; beatsInSec=0; totalBeats=0; genN=0;
  voices=SEED_VOICES.map(s=>s.split(''));
  scheduledBeats=[];
  document.getElementById('playBtn').style.display='none';
  document.getElementById('stopBtn').style.display='';
  scheduler();
  requestAnimationFrame(drawLoop);
}

function stopPlay() {
  playing=false; clearTimeout(timerID);
  document.getElementById('playBtn').style.display='';
  document.getElementById('stopBtn').style.display='none';
  document.getElementById('beatNum').textContent='—';
  document.getElementById('barNum').textContent='—';
  document.getElementById('sectionLabel').textContent='—';
  highlightBeat(-1);
}

// ── Beat grid ─────────────────────────────────────────────────────────────────
const dots = [];
function buildGrid() {
  const el = document.getElementById('beatGrid');
  el.innerHTML=''; dots.length=0;
  const sig = parseInt(document.getElementById('timeSig').value)||4;
  for (let i=0;i<32;i++){
    const d=document.createElement('div');
    d.className='bd'+(FIB.has(i)?' fib':'')+(i%(sig*4)===0?' bar1':'');
    d.textContent=FIB.has(i)?'W':'';
    el.appendChild(d); dots.push(d);
  }
}

let lastDot=-1;
function highlightBeat(b){
  if(lastDot>=0&&dots[lastDot])
    dots[lastDot].className='bd'+(FIB.has(lastDot)?' fib':'')+(lastDot%((parseInt(document.getElementById('timeSig').value)||4)*4)===0?' bar1':'');
  if(b>=0&&b<32&&dots[b])
    dots[b].className='bd active'+(FIB.has(b)?' fib':'');
  lastDot=b;
}

function drawLoop(){
  if(!playing) return;
  const now=ctx.currentTime;
  let cur=-1;
  for(const sb of scheduledBeats){
    if(sb.time<=now+0.02) cur=sb.pos; else break;
  }
  while(scheduledBeats.length>0&&scheduledBeats[0].time<now-0.5) scheduledBeats.shift();
  if(cur!==lastDot){
    highlightBeat(cur);
    const sig=parseInt(document.getElementById('timeSig').value)||4;
    const barBeat=totalBeats%(sig*4);
    document.getElementById('beatNum').textContent=(barBeat%sig)+1;
    document.getElementById('barNum').textContent=Math.floor(totalBeats/(sig*4))+1;
    const sec=sections[curSec]||sections[0];
    document.getElementById('sectionLabel').textContent=sec.name+' — '+sec.key+' '+sec.mode;
    document.getElementById('secProgress').textContent=`Section ${curSec+1} of ${sections.length}`;
    const total=sections.reduce((s,sec)=>s+sec.bars*(parseInt(document.getElementById('timeSig').value)||4)*4,0);
    const elapsed=sections.slice(0,curSec).reduce((s,sec)=>s+sec.bars*(parseInt(document.getElementById('timeSig').value)||4)*4,0)+beatsInSec;
    document.getElementById('progressFill').style.width=(total>0?elapsed/total*100:0).toFixed(1)+'%';
    renderTimeline();
  }
  requestAnimationFrame(drawLoop);
}

// ── Song structure ─────────────────────────────────────────────────────────────
function renderTimeline(){
  const el=document.getElementById('timeline');
  const total=sections.reduce((s,sec)=>s+sec.bars,0)||1;
  el.innerHTML='';
  sections.forEach((sec,i)=>{
    const d=document.createElement('div');
    d.className='sec-block'+(i===curSec?' cur':'');
    d.style.width=Math.max(88,(sec.bars/total*600)).toFixed(0)+'px';
    d.innerHTML=`<button class="del" onclick="delSec(event,${i})">×</button>
      <div class="sec-name">${sec.name}</div>
      <div class="sec-meta">${sec.bpm}bpm &nbsp;${sec.key} ${sec.mode.split(' ')[0]}<br>${sec.bars} bars</div>`;
    d.onclick=()=>jumpTo(i);
    el.appendChild(d);
  });
  document.getElementById('secProgress').textContent=`Section ${curSec+1} of ${sections.length}`;
}

function addSection(){
  const name=document.getElementById('nName').value||'Section';
  const bpm=+document.getElementById('nBpm').value||90;
  const key=document.getElementById('nKey').value;
  const mode=document.getElementById('nMode').value;
  const bars=+document.getElementById('nBars').value||8;
  sections.push({name,bpm,key,mode,bars});
  // Pre-generate buffers for new section if playing
  if(ctx&&playing){
    for(const f of scaleFreqs(key,mode)) ensureNote(f);
    ensureNote(KEY_BASE[key]/2);
  }
  renderTimeline();
}

function delSec(e,i){
  e.stopPropagation();
  if(sections.length<=1) return;
  sections.splice(i,1);
  if(curSec>=sections.length) curSec=sections.length-1;
  renderTimeline();
}

function jumpTo(i){
  curSec=i; beatsInSec=0;
  const sec=sections[i];
  document.getElementById('keySelect').value=sec.key;
  document.getElementById('modeSelect').value=sec.mode;
  document.getElementById('bpmSlider').value=sec.bpm;
  document.getElementById('bpmNum').textContent=sec.bpm;
  renderTimeline();
}

// ── Controls wiring ───────────────────────────────────────────────────────────
document.getElementById('bpmSlider').addEventListener('input',e=>{
  const v=+e.target.value;
  document.getElementById('bpmNum').textContent=v;
  if(sections[curSec]) sections[curSec].bpm=v;
  document.getElementById('nBpm').value=v;
  renderTimeline();
});
document.getElementById('keySelect').addEventListener('change',e=>{
  if(sections[curSec]) sections[curSec].key=e.target.value;
  document.getElementById('nKey').value=e.target.value;
  renderTimeline();
});
document.getElementById('modeSelect').addEventListener('change',e=>{
  if(sections[curSec]) sections[curSec].mode=e.target.value;
  document.getElementById('nMode').value=e.target.value;
  renderTimeline();
});
document.getElementById('timeSig').addEventListener('change',buildGrid);
document.getElementById('playBtn').addEventListener('click',startPlay);
document.getElementById('stopBtn').addEventListener('click',stopPlay);

// Tap tempo
document.getElementById('tapBtn').addEventListener('click',()=>{
  const now=Date.now();
  tapTimes.push(now);
  if(tapTimes.length>6) tapTimes.shift();
  if(tapTimes.length>=2){
    const gaps=tapTimes.slice(1).map((t,i)=>t-tapTimes[i]);
    const avg=gaps.reduce((a,b)=>a+b)/gaps.length;
    const bpm=Math.round(Math.min(220,Math.max(20,60000/avg)));
    document.getElementById('bpmSlider').value=bpm;
    document.getElementById('bpmNum').textContent=bpm;
    document.getElementById('bpmHint').textContent='← tapped';
    if(sections[curSec]) sections[curSec].bpm=bpm;
    renderTimeline();
    setTimeout(()=>document.getElementById('bpmHint').textContent='',1200);
  }
});

// Keyboard: space = play/stop, T = tap
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space'){e.preventDefault(); playing?stopPlay():startPlay();}
  if(e.key==='t'||e.key==='T') document.getElementById('tapBtn').click();
});

function toggleLayer(i){
  layers[i]=!layers[i];
  const el=document.getElementById('lbtn'+i);
  el.classList.toggle('on',layers[i]);
  el.classList.toggle('off',!layers[i]);
}
function toggleWail(){
  wailOn=!wailOn;
  const el=document.getElementById('lbtnW');
  el.classList.toggle('on',wailOn);
  el.classList.toggle('off',!wailOn);
}

// ── Init ──────────────────────────────────────────────────────────────────────
buildGrid();
renderTimeline();
</script>
</body>
</html>
